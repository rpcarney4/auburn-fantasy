name: Full sync Sleeper data (historical)

on:
  schedule:
    # Monthly safety net for late corrections to past seasons. The daily
    # sync-sleeper.yml only touches the current season — this walks the
    # entire previous_league_id chain back through every prior season too.
    - cron: "0 10 1 * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - run: npm run sync:sleeper:full
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
